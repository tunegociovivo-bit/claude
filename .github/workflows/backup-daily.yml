name: Backup diario

on:
  schedule:
    # 03:00 UTC (04:00 / 05:00 en España según horario)
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Lanza backup en Hub
        env:
          HUB_BASE_URL: ${{ secrets.HUB_BASE_URL }}
          INTERNAL_CRON_TOKEN: ${{ secrets.INTERNAL_CRON_TOKEN }}
        run: |
          set -e
          # Host por defecto si HUB_BASE_URL no está (evita "No host part in URL").
          BASE="${HUB_BASE_URL:-https://hub.negociovivo.app}"
          BASE="${BASE%/}"
          if [ -z "${INTERNAL_CRON_TOKEN:-}" ]; then
            echo "::error::Falta el secret INTERNAL_CRON_TOKEN en este repositorio (mismo valor que en el Hub)."
            exit 1
          fi
          echo "Llamando a ${BASE}/api/v1/internal/backup-cron"
          response=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${INTERNAL_CRON_TOKEN}" \
            -H "X-Cron-Trigger: 1" \
            -H "Content-Type: application/json" \
            "${BASE}/api/v1/internal/backup-cron")
          echo "HTTP $response"
          cat /tmp/body
          if [ "$response" != "200" ]; then
            echo "::error::Backup endpoint devolvió $response (revisa INTERNAL_CRON_TOKEN)."
            exit 1
          fi
