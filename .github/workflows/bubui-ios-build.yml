name: Build Bubui (iOS → TestFlight)

# Compila la app iOS en la NUBE de EAS. Dos modos (elige al lanzar):
#
# Para "testflight" hace falta:
#   EXPO_TOKEN
#   ASC_API_KEY_P8, ASC_API_KEY_ID, ASC_API_KEY_ISSUER_ID
#   APPLE_TEAM_ID
#   IOS_DIST_CERT_P12  (base64 del .p12 con password bubui2026)
#   IOS_PROV_PROFILE   (base64 del .mobileprovision)
#   DIST_CERT_PASSWORD (password del p12, valor: bubui2026)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Qué compilar"
        type: choice
        options:
          - testflight
          - simulator
        default: testflight
      submit:
        description: "Subir a TestFlight tras compilar (solo aplica a 'testflight' y requiere ascAppId)"
        type: boolean
        default: false

jobs:
  ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bubui-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bubui-mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install deps
        run: npm ci

      # ── Modo simulador ──
      - name: Build iOS para SIMULADOR (EAS cloud)
        if: ${{ inputs.target == 'simulator' }}
        run: |
          eas build --platform ios --profile ios-simulator --non-interactive --wait

      # ── Modo TestFlight / App Store ──
      - name: Write App Store Connect API key
        if: ${{ inputs.target == 'testflight' }}
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"

      - name: Prepare local iOS credentials
        if: ${{ inputs.target == 'testflight' }}
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_PROV_PROFILE: ${{ secrets.IOS_PROV_PROFILE }}
        run: |
          mkdir -p $RUNNER_TEMP/ios-creds
          echo "$IOS_DIST_CERT_P12" | base64 -d > $RUNNER_TEMP/ios-creds/dist-cert.p12
          echo "$IOS_PROV_PROFILE" | base64 -d > $RUNNER_TEMP/ios-creds/bubui.mobileprovision
          cat > credentials.json << 'CREDS_EOF'
          {
            "ios": {
              "com.negociovivo.bubui": {
                "distributionCertificate": {
                  "path": "__CERT_PATH__",
                  "password": "__CERT_PASS__"
                },
                "provisioningProfilePath": "__PROV_PATH__"
              }
            }
          }
          CREDS_EOF
          CERT_PATH=$RUNNER_TEMP/ios-creds/dist-cert.p12
          PROV_PATH=$RUNNER_TEMP/ios-creds/bubui.mobileprovision
          CERT_PASS=${{ secrets.DIST_CERT_PASSWORD }}
          sed -i "s|__CERT_PATH__|$CERT_PATH|g" credentials.json
          sed -i "s|__PROV_PATH__|$PROV_PATH|g" credentials.json
          sed -i "s|__CERT_PASS__|$CERT_PASS|g" credentials.json
          echo "credentials.json created:"
          cat credentials.json

      - name: Build iOS firmado (EAS cloud)
        if: ${{ inputs.target == 'testflight' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE || 'COMPANY_OR_ORGANIZATION' }}
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Submit to TestFlight
        if: ${{ inputs.target == 'testflight' && inputs.submit }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: eas submit --platform ios --latest --non-interactive
