name: Build Bubui (iOS → TestFlight)

# Compila la app iOS en la NUBE de EAS. Dos modos (elige al lanzar):
#
#  • testflight → build firmado para pruebas reales / App Store y, opcional,
#                 subida automática a TestFlight. Sin Mac ni 2FA: la firma se
#                 gestiona con una App Store Connect API Key.
#  • simulator  → build para SIMULADOR de iPhone. NO necesita firma de Apple
#                 (ni la API Key), solo EXPO_TOKEN. Sirve para sacar capturas
#                 de pantalla subiendo el .app a https://appetize.io y correrlo
#                 en un iPhone simulado dentro del navegador.
#
# Uso: pestaña Actions → "Build Bubui (iOS → TestFlight)" → Run workflow →
#      elige "target" (y si quieres subir a TestFlight).
#
# ┌── SECRETOS (Settings → Secrets and variables → Actions → New secret)
# │  Para "simulator" basta con:
# │     EXPO_TOKEN            expo.dev → tu avatar → Access Tokens → Create token.
# │
# │  Para "testflight" hacen falta además (los genera el dueño en sus cuentas):
# │     ASC_API_KEY_P8        Contenido COMPLETO del .p8 de la API Key
# │                           (incluidas las líneas BEGIN/END PRIVATE KEY).
# │     ASC_API_KEY_ID        "Key ID" de esa API Key.
# │     ASC_API_KEY_ISSUER_ID "Issuer ID" de App Store Connect.
# │     APPLE_TEAM_ID         Apple Developer → Membership → Team ID.
# │     APPLE_TEAM_TYPE       (opcional) COMPANY_OR_ORGANIZATION | INDIVIDUAL | IN_HOUSE
# └──
#   La API Key se crea en: App Store Connect → Users and Access → Integrations
#   → App Store Connect API → Team Keys → (+). Rol: App Manager o Admin.
#
#   Para subir a TestFlight (submit = true) rellena también, en
#   apps/bubui-mobile/eas.json, submit.production.ios.ascAppId con el "Apple ID"
#   numérico de la app (App Store Connect → tu app → App Information).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Qué compilar"
        type: choice
        options:
          - testflight
          - simulator
        default: testflight
      submit:
        description: "Subir a TestFlight tras compilar (solo aplica a 'testflight' y requiere ascAppId)"
        type: boolean
        default: false

jobs:
  ios:
    runs-on: ubuntu-latest # el build ocurre en la nube de EAS; el runner solo orquesta
    defaults:
      run:
        working-directory: apps/bubui-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bubui-mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install deps
        run: npm ci

      # ── Modo simulador: para capturas en Appetize. Solo EXPO_TOKEN. ──
      - name: Build iOS para SIMULADOR (EAS cloud)
        if: ${{ inputs.target == 'simulator' }}
        run: |
          echo "Compilando build de simulador. Al terminar, descarga el .app"
          echo "desde el enlace del build (expo.dev) y súbelo a https://appetize.io"
          eas build --platform ios --profile ios-simulator --non-interactive --wait

      # ── Modo TestFlight / App Store: build firmado con API Key de Apple. ──
      - name: Write App Store Connect API key
        if: ${{ inputs.target == 'testflight' }}
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"

      - name: Build iOS firmado (EAS cloud)
        if: ${{ inputs.target == 'testflight' }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE || 'COMPANY_OR_ORGANIZATION' }}
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Submit to TestFlight
        if: ${{ inputs.target == 'testflight' && inputs.submit }}
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: eas submit --platform ios --latest --non-interactive
