name: NV Leads · recordatorios de seguimiento
# Corre cada 10 min. Avisa cuando vence un recordatorio puesto en una
# conversación del inbox y la sube a "seguimiento". Idempotente.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint cron
        run: |
          curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors -X GET \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN || secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/leads-followups
