name: Renovar watch channels de Google Calendar
# Una vez al día. Renueva cualquier canal que expire en <48h. Google
# corta los canales a 30 días máximo, así que sin esto los push
# notifications se acaban silenciosamente.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint calendar-watch-renew
        run: |
          curl -fsSL -X GET \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN || secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/calendar-watch-renew
