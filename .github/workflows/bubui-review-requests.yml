name: Bubui · solicitud de reseña en Google
# Corre cada 5 min. Envía un push pidiendo reseña en Google ~10 min después de
# que el cliente escanee el ticket (negocios con reviewPushEnabled + Place ID).
# Idempotente vía BubuiPurchase.reviewPushedAt: seguro ejecutarlo de más.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # permite disparar a mano desde GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint cron
        run: |
          curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors -X GET \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN || secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/bubui-review-requests
