name: Vigilancia de credenciales
# Cada 6 horas valida las integraciones configuradas en cada workspace
# (Meta Ads, Make, OpenAI, Anthropic, ElevenLabs, Holded). Si alguna
# falla (token caducado, permisos revocados), alerta al admin del
# workspace por Telegram/WhatsApp ANTES de que una task lo necesite.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint credential-watch
        run: |
          curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors -X GET \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN || secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/credential-watch
