name: Tests E2E
on:
  workflow_dispatch:
  # Para no quemar minutos en cada push, lo dejamos manual. Si en el
  # futuro quieres en cada PR, descomenta:
  # pull_request:
  #   branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agencia-platform/package-lock.json
      - working-directory: agencia-platform
        run: npm ci
      - working-directory: agencia-platform
        run: npm run test:e2e:install
      - working-directory: agencia-platform
        run: |
          # Sin BD productiva: corremos solo los tests no autenticados.
          # Si hay user de pruebas seedeado, define E2E_USER_EMAIL en
          # los secrets del repo y elimina la línea --grep-invert.
          npm run test:e2e -- --grep-invert "@auth"
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'http://localhost:3000' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: agencia-platform/playwright-report/
          retention-days: 7
