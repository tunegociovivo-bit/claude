name: Briefing diario de Sonia

on:
  schedule:
    # 06:00 UTC ≈ 08:00 hora peninsular (07:00 en invierno). Resumen del
    # día: tareas que vencen/atrasadas, eventos de hoy y reseñas GMB sin
    # responder. Idempotente: una notificación por usuario y día.
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Trigger temporal para lanzar una ejecución de prueba al tocar este archivo.
  push:
    paths:
      - .github/workflows/sonia-briefing.yml

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint sonia-briefing
        run: |
          set -e
          # Misma convención que el resto de crons: HUB_BASE_URL + INTERNAL_CRON_TOKEN.
          base="${{ secrets.HUB_BASE_URL }}"
          base="${base:-https://hub.negociovivo.app}"
          response=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN }}" \
            "${base}/api/cron/sonia-briefing")
          echo "HTTP $response"
          cat /tmp/body
          if [ "$response" != "200" ]; then
            echo "::error::sonia-briefing devolvió $response"
            exit 1
          fi
