name: Bubui challenge follow-ups
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Notify businesses about challenge conversions
        run: curl --fail --silent --show-error -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://hub.negociovivo.app/api/cron/bubui-challenge-followups
