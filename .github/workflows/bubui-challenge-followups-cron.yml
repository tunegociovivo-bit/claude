name: Bubui · seguimiento de retos

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: # permite verificarlo manualmente

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: bubui-challenge-followups
      cancel-in-progress: false
    steps:
      - name: Avisar a los negocios sobre conversiones de retos
        run: >-
          curl --fail --silent --show-error
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          https://hub.negociovivo.app/api/cron/bubui-challenge-followups
