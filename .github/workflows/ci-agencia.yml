name: CI Agencia (typecheck)

# Compila los tipos de agencia-platform en cada push a la rama de producción y
# en cada PR. Objetivo: cazar errores de TypeScript (como el 'checkedAt' que
# tumbó un deploy) ANTES de que Railway despliegue. Si sale en rojo, NO
# despliegues hasta arreglarlo.

on:
  push:
    branches:
      - claude/wordpress-ai-review-plugin-bdSLe
    paths:
      - "agencia-platform/**"
      - ".github/workflows/ci-agencia.yml"
  pull_request:
    paths:
      - "agencia-platform/**"

concurrency:
  group: ci-agencia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agencia-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agencia-platform/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar cliente Prisma (necesario para los tipos)
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Guardas de tenant (aislamiento por workspace)
        run: node scripts/check-tenant-guards.mjs

      - name: Tests unitarios (vitest)
        run: npx vitest run

      - name: Política de acceso del agente de móviles
        run: node --test mobile-agent/access-policy.check.cjs

  bubui-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bubui_test
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: bubui_audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bubui_test -d bubui_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bubui_test:fictional-ci-only@127.0.0.1:5432/bubui_audit_test
      DISABLE_INAPP_CRON: "1"
    defaults:
      run:
        working-directory: agencia-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agencia-platform/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Preparar base efímera con datos ficticios
        run: npx prisma db push
      - name: Compras, retos y pagos con concurrencia real
        run: npx vitest run --config vitest.bubui-integration.config.ts
