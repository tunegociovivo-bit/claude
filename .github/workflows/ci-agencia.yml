name: CI Agencia (typecheck)

# Compila los tipos de agencia-platform en cada push a la rama de producción y
# en cada PR. Objetivo: cazar errores de TypeScript (como el 'checkedAt' que
# tumbó un deploy) ANTES de que Railway despliegue. Si sale en rojo, NO
# despliegues hasta arreglarlo.

on:
  push:
    branches:
      - claude/wordpress-ai-review-plugin-bdSLe
    paths:
      - "agencia-platform/**"
      - ".github/workflows/ci-agencia.yml"
  pull_request:
    paths:
      - "agencia-platform/**"

concurrency:
  group: ci-agencia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agencia-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agencia-platform/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar cliente Prisma (necesario para los tipos)
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Guardas de tenant (aislamiento por workspace)
        run: node scripts/check-tenant-guards.mjs

      - name: Tests unitarios (vitest)
        run: npx vitest run
