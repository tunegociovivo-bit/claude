name: Reindex embeddings
# Una vez al día como red de seguridad. Los hooks en los endpoints
# re-indexan en tiempo real; este cron solo captura lo que se quedó
# atrás (fallos de red, rate limits, importaciones bulk).
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint reindex
        run: |
          curl -fsSL --retry 4 --retry-delay 30 --retry-all-errors -X GET \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN || secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/reindex
