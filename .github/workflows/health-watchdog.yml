name: Hub · vigilante de crons
# Corre cada 30 min. Comprueba que todos los crons se estén ejecutando con su
# cadencia y, si alguno lleva "mudo" más de lo esperado, avisa por email
# (OPS_ALERT_EMAIL). Detecta fallos silenciosos como el del CRON_SECRET.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint cron
        run: |
          curl -fsSL -X GET \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN || secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/health-watchdog
