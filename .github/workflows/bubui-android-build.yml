name: Build Bubui (Android APK + AAB)

# Compila la app móvil Bubui con Gradle (firma estable con el mismo keystore,
# para que cada APK se instale ENCIMA del anterior) y publica en una GitHub
# Release con enlaces fijos:
#   - APK → releases/latest/download/bubui.apk   (instalar en el móvil)
#   - AAB → releases/latest/download/bubui.aab   (subir a Google Play)
#
# Uso: pestaña Actions → "Build Bubui (Android APK + AAB)" → Run workflow.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para publicar la Release con el APK
    defaults:
      run:
        working-directory: apps/bubui-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bubui-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Fijar versionCode automático (Google Play exige uno creciente)
        run: |
          # versionCode = 1000 + nº de run → siempre creciente y por encima del
          # valor histórico fijo (29). El prebuild lo lee de app.json.
          VC=$((1000 + ${{ github.run_number }}))
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));c.expo.android=c.expo.android||{};c.expo.android.versionCode=$VC;c.expo.ios=c.expo.ios||{};c.expo.ios.buildNumber=String($VC);fs.writeFileSync('app.json',JSON.stringify(c,null,2)+'\n');console.log('versionCode =',$VC);"

      - name: (Opcional) Restaurar google-services.json para push Android (FCM)
        env:
          BUBUI_GOOGLE_SERVICES_JSON: ${{ secrets.BUBUI_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # Si el secret está configurado, escribe el archivo ANTES del prebuild
          # para que el config plugin lo detecte y active FCM. Si no está, el
          # build sigue (los push de Android simplemente no se entregan).
          if [ -n "${BUBUI_GOOGLE_SERVICES_JSON:-}" ]; then
            echo "${BUBUI_GOOGLE_SERVICES_JSON}" | base64 -d > google-services.json
            if [ ! -s google-services.json ]; then
              echo "::error::BUBUI_GOOGLE_SERVICES_JSON presente pero el archivo quedó vacío tras decodificar."
              exit 1
            fi
            echo "google-services.json restaurado → push Android ACTIVADO."
          else
            echo "::warning::Sin secret BUBUI_GOOGLE_SERVICES_JSON: push Android DESACTIVADO en este build (todo lo demás funciona)."
          fi

      - name: Prebuild (genera android/)
        run: CI=1 npx expo prebuild --clean --platform android --no-install

      - name: Restaurar keystore estable
        env:
          BUBUI_KEYSTORE_B64: ${{ secrets.BUBUI_KEYSTORE_B64 }}
          BUBUI_STORE_PASS: ${{ secrets.BUBUI_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          # Falla RUIDOSAMENTE si faltan los secrets, en vez de seguir y acabar
          # firmando con la clave de debug (bug histórico de los builds #6-#8).
          if [ -z "${BUBUI_KEYSTORE_B64}" ]; then
            echo "::error::Falta el secret BUBUI_KEYSTORE_B64. Configúralo en Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${BUBUI_STORE_PASS}" ]; then
            echo "::error::Falta el secret BUBUI_KEYSTORE_PASS."
            exit 1
          fi
          echo "${BUBUI_KEYSTORE_B64}" | base64 -d > android/app/release.keystore
          # Verifica que el keystore no quedó vacío y que la contraseña es válida.
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::release.keystore quedó vacío tras decodificar el secret."
            exit 1
          fi
          keytool -list -keystore android/app/release.keystore -storepass "${BUBUI_STORE_PASS}" >/dev/null
          echo "Keystore restaurado y validado correctamente."

      - name: Exportar certificado de subida (.pem) + huellas
        working-directory: apps/bubui-mobile/android/app
        env:
          BUBUI_STORE_PASS: ${{ secrets.BUBUI_KEYSTORE_PASS }}
          BUBUI_KEY_ALIAS: ${{ secrets.BUBUI_KEY_ALIAS }}
        run: |
          # Certificado público que Play pide al restablecer la clave de subida.
          keytool -export -rfc \
            -keystore release.keystore \
            -alias "$BUBUI_KEY_ALIAS" \
            -storepass "$BUBUI_STORE_PASS" \
            -file upload_certificate.pem
          echo "=== Huellas de ESTE keystore (clave de subida del workflow) ==="
          keytool -list -v -keystore release.keystore -alias "$BUBUI_KEY_ALIAS" -storepass "$BUBUI_STORE_PASS" | grep -iE "SHA1|SHA256" || true

      - name: Compilar APK + AAB (release firmado)
        working-directory: apps/bubui-mobile/android
        env:
          BUBUI_STORE_FILE: release.keystore
          BUBUI_STORE_PASS: ${{ secrets.BUBUI_KEYSTORE_PASS }}
          BUBUI_KEY_ALIAS: ${{ secrets.BUBUI_KEY_ALIAS }}
          BUBUI_KEY_PASS: ${{ secrets.BUBUI_KEY_PASS }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Renombrar a nombres estables (bubui.apk / bubui.aab)
        working-directory: apps/bubui-mobile/android/app/build/outputs
        run: |
          apk=$(ls apk/release/*.apk | head -1)
          cp "$apk" apk/release/bubui.apk
          echo "APK: $apk"
          aab=$(ls bundle/release/*.aab | head -1)
          cp "$aab" bundle/release/bubui.aab
          echo "AAB: $aab"

      - name: Verificar que el APK quedó firmado con la clave CORRECTA
        working-directory: apps/bubui-mobile/android/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          # Huella SHA-256 de la clave de subida estable (release.keystore).
          # Si el APK sale firmado con otra clave (p.ej. la de DEBUG, el bug de
          # los builds #6-#8), este paso FALLA en vez de publicar un AAB que
          # Google Play rechazará.
          EXPECTED="7e239a586a72a74b2fc1435ceaf311571f2a07859795eb0328108554a90724fb"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::No se encontró apksigner en el SDK de Android."
            exit 1
          fi
          GOT="$("$APKSIGNER" verify --print-certs bubui.apk | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          echo "Huella del APK firmado: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::El APK NO está firmado con la clave de subida esperada."
            echo "::error::  obtenida=$GOT"
            echo "::error::  esperada=$EXPECTED"
            echo "::error::Probablemente se firmó con la clave de DEBUG. Revisa los secrets y el config plugin."
            exit 1
          fi
          echo "✅ APK firmado correctamente con la clave de subida estable (SHA-256 $GOT)."

      - name: Subir APK + AAB como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bubui-android
          path: |
            apps/bubui-mobile/android/app/build/outputs/apk/release/bubui.apk
            apps/bubui-mobile/android/app/build/outputs/bundle/release/bubui.aab
          if-no-files-found: error

      - name: Publicar APK + AAB + certificado en una Release (enlaces estables)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bubui-${{ github.run_number }}
          name: Bubui APK #${{ github.run_number }}
          make_latest: true
          files: |
            apps/bubui-mobile/android/app/build/outputs/apk/release/bubui.apk
            apps/bubui-mobile/android/app/build/outputs/bundle/release/bubui.aab
            apps/bubui-mobile/android/app/upload_certificate.pem
          body: |
            Bubui · build #${{ github.run_number }} · commit ${{ github.sha }}

            **APK (instalar en el móvil, siempre la última versión):**
            https://github.com/${{ github.repository }}/releases/latest/download/bubui.apk

            **AAB (subir a Google Play Console):**
            https://github.com/${{ github.repository }}/releases/latest/download/bubui.aab

            **Certificado de subida (para restablecer la clave en Play Console):**
            https://github.com/${{ github.repository }}/releases/latest/download/upload_certificate.pem

            El APK se instala encima de la versión anterior (misma firma).
