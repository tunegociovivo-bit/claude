name: Build APK Bubui (Android)

# Compila la app móvil Bubui con Gradle (firma estable con el mismo keystore,
# para que cada APK se instale ENCIMA del anterior) y:
#   - deja el APK como artifact descargable
#   - lo publica en una GitHub Release con enlace fijo:
#       releases/latest/download/bubui.apk
#
# Uso: pestaña Actions → "Build APK Bubui (Android)" → Run workflow.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # necesario para publicar la Release con el APK
    defaults:
      run:
        working-directory: apps/bubui-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bubui-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild (genera android/)
        run: CI=1 npx expo prebuild --clean --platform android --no-install

      - name: Restaurar keystore estable
        run: echo "${{ secrets.BUBUI_KEYSTORE_B64 }}" | base64 -d > android/app/release.keystore

      - name: Compilar APK (release firmado)
        working-directory: apps/bubui-mobile/android
        env:
          BUBUI_STORE_FILE: release.keystore
          BUBUI_STORE_PASS: ${{ secrets.BUBUI_KEYSTORE_PASS }}
          BUBUI_KEY_ALIAS: ${{ secrets.BUBUI_KEY_ALIAS }}
          BUBUI_KEY_PASS: ${{ secrets.BUBUI_KEY_PASS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Renombrar APK a un nombre estable (bubui.apk)
        working-directory: apps/bubui-mobile/android/app/build/outputs/apk/release
        run: |
          apk=$(ls *.apk | head -1)
          cp "$apk" bubui.apk
          echo "APK original: $apk"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubui-android-apk
          path: apps/bubui-mobile/android/app/build/outputs/apk/release/bubui.apk
          if-no-files-found: error

      - name: Publicar APK en una Release (enlace de descarga estable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bubui-${{ github.run_number }}
          name: Bubui APK #${{ github.run_number }}
          make_latest: true
          files: apps/bubui-mobile/android/app/build/outputs/apk/release/bubui.apk
          body: |
            APK de Bubui · build #${{ github.run_number }} · commit ${{ github.sha }}

            **Descarga directa (siempre la última versión):**
            https://github.com/${{ github.repository }}/releases/latest/download/bubui.apk

            Se instala encima de la versión anterior (misma firma).
