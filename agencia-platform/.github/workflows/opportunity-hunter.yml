name: Opportunity Hunter diario

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Rastrear señales comerciales
        run: |
          curl --fail --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/opportunity-hunter
