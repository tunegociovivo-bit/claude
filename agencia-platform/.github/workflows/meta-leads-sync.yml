name: Sincronizar leads de Meta y documentos online

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar fuentes de leads pendientes
        run: |
          curl -fsSL -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/meta-leads-sync
