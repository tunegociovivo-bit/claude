name: Notificaciones de tarea por email
# Corre cada 5 min (mínimo de GitHub Actions). El endpoint busca tareas
# con dueDate próxima y dispara los emails según las reglas de cada
# tarea (day_7am, 1h_before, 10min_before). La tabla
# TaskNotificationSent evita duplicados.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # permite disparar a mano desde GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoint cron
        run: |
          curl -fsSL -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://hub.negociovivo.app/api/cron/task-notifications
