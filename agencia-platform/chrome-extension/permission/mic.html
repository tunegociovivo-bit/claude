<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Permiso de micrófono — Hub Reuniones</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 460px; margin: 48px auto; padding: 0 20px; color: #0f172a; line-height: 1.5; }
  h2 { font-size: 20px; }
  button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin: 16px 0; padding: 12px 14px; border-radius: 8px; background: #f1f5f9; font-size: 14px; }
  .ok { background: #ecfdf5; color: #065f46; }
  .err { background: #fef2f2; color: #991b1b; }
</style>
</head>
<body>
  <h2>🎤 Activar micrófono</h2>
  <p>Para que Sonia grabe <b>también tu voz</b> en las reuniones (no solo a los demás), Chrome necesita tu permiso de micrófono <b>una vez</b>.</p>
  <div class="msg" id="msg">Pulsa el botón y elige <b>Permitir</b> en el aviso de Chrome.</div>
  <button id="grant">Permitir micrófono</button>
  <script src="mic.js"></script>
</body>
</html>
