version: "3.9"

services:
  app:
    build: .
    image: agencia-hub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agencia}:${POSTGRES_PASSWORD:-agencia}@postgres:5432/${POSTGRES_DB:-agencia}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      MEILI_HOST: http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      meilisearch:
        condition: service_started
    networks: [internal]
    expose: ["3000"]
    command: >
      sh -c "npx prisma migrate deploy && node node_modules/.bin/next start -p 3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agencia}
      POSTGRES_DB: ${POSTGRES_DB:-agencia}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-agencia}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks: [internal]
    expose: ["9000", "9001"]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    networks: [internal]
    expose: ["7700"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, minio]
    networks: [internal]

volumes:
  pg_data:
  redis_data:
  minio_data:
  meili_data:
  caddy_data:
  caddy_config:

networks:
  internal:
